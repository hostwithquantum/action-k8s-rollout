name: action-k8s-rollout
description: Wait for Kubernetes rollouts to finish (multiple at the same time)
inputs:
  resources:
    required: false
    default: ''
    description: >
      list of kind/name, one per line (space or comma separated works too),
      a bare name means deployment/name
  selector:
    required: false
    default: ''
    description: label selector, matches deployments, statefulsets and daemonsets
  manifest:
    required: false
    default: ''
    description: manifest file, watches all workloads in it
  namespace:
    required: false
    default: ''
    description: Kubernetes namespace (default is from kube context or manifest)
  timeout:
    required: false
    default: 5m
    description: timeout per resource (e.g. 90s, 5m), a plain number is seconds
runs:
  using: composite
  steps:
    - name: wait for rollout
      shell: bash
      env:
        ROLLOUT_RESOURCES: ${{ inputs.resources }}
        ROLLOUT_SELECTOR: ${{ inputs.selector }}
        ROLLOUT_MANIFEST: ${{ inputs.manifest }}
        ROLLOUT_NAMESPACE: ${{ inputs.namespace }}
        ROLLOUT_TIMEOUT: ${{ inputs.timeout }}
      run: '"${GITHUB_ACTION_PATH}/rollout.sh"'
