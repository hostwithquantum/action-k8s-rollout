---
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: shellcheck rollout.sh test/bin/kubectl
      - run: make test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      - run: |
          kubectl create namespace demo
          kubectl create deployment web --image=registry.k8s.io/pause:3.10 -n demo
          kubectl create deployment worker --image=registry.k8s.io/pause:3.10 -n demo
          kubectl create deployment broken --image=registry.k8s.io/pause:does-not-exist -n demo
      - name: resources
        uses: $/
        with:
          namespace: demo
          resources: |
            web
            deployment/worker
      - name: selector
        uses: $/
        with:
          namespace: demo
          selector: app in (web, worker)
          timeout: 60
      - name: broken rollout
        id: broken
        uses: $/
        continue-on-error: true
        with:
          namespace: demo
          resources: web broken
          timeout: 20s
      - name: broken rollout must fail
        if: ${{ steps.broken.outcome != 'failure' }}
        run: exit 1
